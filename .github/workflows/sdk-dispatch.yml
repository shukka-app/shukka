# Tells the SDK repository that a release changed the contract.
#
# shukka-app/sdk listens for `shukka-release`: its generate.yml fetches the
# snapshots named in the payload, regenerates every language, and opens a pull
# request only when the contract actually moved.
#
# Cross-repository dispatch needs a token that can write to the SDK repository;
# GITHUB_TOKEN is scoped to this one. Create a fine-grained PAT for
# shukka-app/sdk with "Contents: read and write" and store it as the
# SDK_DISPATCH_TOKEN secret (Settings → Secrets and variables → Actions).
name: SDK dispatch

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to dispatch
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Send shukka-release to shukka-app/sdk
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send the tag's contract snapshots
        env:
          TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "No tag to dispatch. Set one with the workflow's tag input." >&2
            exit 1
          fi
          if [ -z "$TOKEN" ]; then
            echo "SDK_DISPATCH_TOKEN is not set. Create a fine-grained PAT for" >&2
            echo "shukka-app/sdk with Contents: read and write, then add it under" >&2
            echo "Settings → Secrets and variables → Actions." >&2
            exit 1
          fi

          # Pin to the tag: the SDK is generated from the release the tag names,
          # not from whatever `main` looks like when the dispatch lands.
          SPEC_BASE="https://raw.githubusercontent.com/shukka-app/shukka/${TAG}/apps/docs/public"
          jq -n --arg url "$SPEC_BASE" --arg tag "$TAG" \
            '{event_type: "shukka-release", client_payload: {spec_base_url: $url, tag: $tag}}' \
            > payload.json

          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/shukka-app/sdk/dispatches \
            -d @payload.json
          echo "Dispatched ${TAG} to shukka-app/sdk (${SPEC_BASE})"
