name: 'Shukka Publish'
description: 'Publish an electron-builder, Tauri, or Sparkle output directory to a Shukka update channel'
author: 'shukka-app'
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  server-url:
    description: 'Base URL of the Shukka instance, e.g. https://updates.example.com'
    required: true
  api-key:
    description: 'Shukka API key bound to the target app'
    required: true
  app:
    description: 'App slug as configured in Shukka'
    required: true
  channel:
    description: 'Target channel'
    required: false
    default: 'stable'
  directory:
    description: 'Build output directory. Electron: flat dist/ with installers, *.blockmap, and latest*.yml. Tauri: src-tauri/target/release/bundle or a platform subdir (appimage, macos, nsis, msi, …). latest.json is optional; *.AppDir and extract trees are skipped. Sparkle: flat directory with appcast.xml and/or a zip/dmg plus a matching sign_update .sig.'
    required: false
    default: 'dist'
  version:
    description: 'Release version. When omitted: Electron reads version: from latest*.yml. Tauri uses this input / SHUKKA_VERSION, then latest.json, then the nearest tauri.conf.json, then a _1.0.0_ token in the artifact filename. Sparkle uses appcast.xml (shortVersionString, else sparkle:version), then an App-1.4.2.zip filename token.'
    required: false
    default: ''
  updater-kind:
    description: 'Optional electron, tauri, or sparkle override. When omitted, inferred from files (yml → electron; appcast.xml or Sparkle archive+.sig → sparkle; .sig / latest.json / known bundle layout → tauri). The server still validates against the app updaterKind.'
    required: false
    default: ''
  create-channel:
    description: 'Create the channel if it does not exist yet'
    required: false
    default: 'false'
  release:
    description: 'If true, the version goes live and the feed can see it. Default false leaves a draft the feed cannot see; promote later in the panel or PATCH the channel currentVersion.'
    required: false
    default: 'false'

outputs:
  version:
    description: 'The published version'
  channel:
    description: 'The channel the version was published to'

# JavaScript action: the runner's Node executes the uploader directly.
# No bash/pwsh/cmd, so Windows self-hosted runners with only MinGit work.
runs:
  using: 'node24'
  main: 'scripts/shukka-upload.mjs'
