# Deploys the example Compose stack from deploy/compose.yaml.
#
#   ansible-playbook -i inventory.ini apps/shukka/deploy/ansible/playbook.yml
#
# Docker Engine with the Compose v2 plugin must already be on the host.
# Override the image or bind port with --extra-vars:
#   -e shukka_image=ghcr.io/shukka-app/shukka:1.0.3 -e shukka_port=3000

- name: Deploy Shukka
  hosts: all
  become: true
  vars:
    shukka_deploy_dir: /opt/shukka
    shukka_image: ghcr.io/shukka-app/shukka
    shukka_port: 3000
    minio_port: 9000
  tasks:
    - name: Check that Docker Compose is available
      ansible.builtin.command:
        cmd: docker compose version
      changed_when: false

    - name: Create the deploy directory
      ansible.builtin.file:
        path: "{{ shukka_deploy_dir }}"
        state: directory
        mode: "0755"

    - name: Copy the Compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../compose.yaml"
        dest: "{{ shukka_deploy_dir }}/compose.yaml"
        mode: "0644"

    - name: Start Shukka and the example MinIO
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "{{ shukka_deploy_dir }}"
      environment:
        SHUKKA_IMAGE: "{{ shukka_image }}"
        SHUKKA_PORT: "{{ shukka_port }}"
        MINIO_PORT: "{{ minio_port }}"
      changed_when: true

    - name: Create the example MinIO bucket
      ansible.builtin.command:
        cmd: docker exec minio mkdir -p /data/releases
      register: minio_bucket
      until: minio_bucket.rc == 0
      retries: 30
      delay: 2
      changed_when: minio_bucket.rc == 0

    - name: Wait until GET /api/health is ok
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ shukka_port }}/api/health"
        method: GET
        return_content: true
        status_code: 200
      register: health
      until: health.status == 200 and health.json.status == "ok" and health.json.db == "ok"
      retries: 45
      delay: 2
